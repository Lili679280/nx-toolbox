<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>换包</title>
<style>/*BASE_CSS*/
/* 换包自己的样式 */
.dev .use{flex:1;min-width:120px;max-width:210px}
.hero{display:flex;flex-direction:column;gap:14px;position:relative}
.eyebrow{font-size:12px;font-weight:600;color:var(--link)}
.eyebrow.warn{color:var(--orange)}
.ver{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ver .old{color:var(--faint);font-weight:500}
.ver svg{color:var(--faint);animation:nudge 2.4s var(--ease) infinite}
@keyframes nudge{0%,60%,100%{transform:none}30%{transform:translateX(5px)}}
.src{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 11px;border-radius:13px;background:var(--fill);font-size:13px;transition:background .2s}
.src:hover{background:var(--fill-h)}
.sumline b{font-weight:600;font-variant-numeric:tabular-nums}
.sumline .d{color:var(--red)}.sumline .i{color:var(--link)}
.prog{display:grid;gap:8px}
.grp{border-top:1px solid var(--hair)}
.grp:first-child{border-top:0}
.grp-h{display:flex;align-items:center;gap:10px;padding:11px 14px}
.disc{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--faint);transition:background .2s}
.disc:hover{background:var(--fill)}
.disc svg{transition:transform .32s var(--ease)}
.grp.open>.grp-h .disc svg{transform:rotate(90deg)}
.grp-t{flex:1;min-width:0;cursor:pointer}
.grp-t strong{font-weight:500;display:block}
.grp-t span{font-size:12px;color:var(--muted);display:block}
.pill{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:color .3s}
.pill.keep{color:var(--green)}.pill.del{color:var(--red)}.pill.swap{color:var(--link)}.pill.mix{color:var(--orange)}.pill.wait{color:var(--faint)}
.pill.busy::before{content:"";width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;border-top-color:transparent;animation:spin .8s linear infinite}
.grp-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
.grp.open .grp-b{grid-template-rows:1fr}
.grp-in{overflow:hidden;min-height:0}
.sub{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 46px;border-top:1px solid var(--hair);font-size:13px}
.sub.fresh{animation:rise .32s var(--ease) both}
.plain .cb,.plain .pill,.plain .why{display:none}
.card>.sub:first-child{border-top:0}
.sub .disc.on svg{transform:rotate(90deg)}
.disc-sp{width:22px;flex:none}
.sub .fi{display:grid;place-items:center;color:var(--link);cursor:default}
.sub .fi.f{color:var(--faint)}
.sub .nm{cursor:default}
.sub .tn{font-family:var(--font);font-weight:500;font-size:13px}
.sub .why.mix{color:var(--orange)}
.sub .mono{flex:1;min-width:0;overflow-wrap:anywhere}
.sub em{font-style:normal;color:var(--faint);font-family:var(--font);margin-left:6px}
.sub .why{font-size:12px;color:var(--muted);white-space:nowrap}
.sub .why.del{color:var(--red)}.sub .why.swap{color:var(--link)}
.lk{display:grid;place-items:center;width:18px;height:18px;color:var(--faint);flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 22px}
.slot{position:relative;width:96px;height:104px;color:var(--link)}
.slot svg{position:absolute;left:24px;top:0;animation:insert 2.8s var(--ease) infinite}
.slot::after{content:"";position:absolute;left:8px;right:8px;bottom:14px;height:4px;border-radius:2px;background:var(--line)}
@keyframes insert{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}60%,80%{transform:translateY(34px);opacity:1}100%{transform:translateY(34px);opacity:0}}
.how{display:grid;gap:10px}
.how div{display:grid;grid-template-columns:22px 1fr;gap:10px}
.how b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--fill);font-size:11px}
.how p{color:var(--muted)}.how strong{color:var(--text);font-weight:600}
.rl{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--hair);font-size:13px}
.rl .mono{flex:1;min-width:0;overflow-wrap:anywhere}
.rl.miss .mono{color:var(--faint)}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="main">
    <header class="navbar" id="navbar"><span></span><div class="navtitle" id="navtitle"></div><span></span></header>
    <div class="page" id="page"></div></main>
</div>
<script>/*BASE_JS*/</script>
<script>
let api;
const S = { page: 'update', phase: 'empty', cards: [], card: null, plan: null, source: { kind: 'none' }, sourceBusy: true,
  open: new Set(), openDirs: new Set(), lazy: new Map(), loading: new Set(), justOpened: null, opts: {}, done: null, job: false, skip: null, notice: '' };
const VIEW = {};
const POLL_CARDS_MS = 1500;
const STEP_CLEAN = '清理旧文件', STEP_INSTALL = '安装新文件', STEP_VERIFY = '校验';

/* ---------- 框架 ---------- */
const { drawSide, nav, draw, follow } = toolShell({ state: S, api: () => api, brand: '换包', views: VIEW, pages: [
  { id: 'update', name: '更新', title: '换包', icon: 'swap' }, { id: 'fw', name: '固件', title: '固件', icon: 'chip' },
  { id: 'snaps', name: '快照', title: '快照', icon: 'clock' }, { id: 'settings', name: '设置', title: '设置', icon: 'gear', bottom: true }] });

/* ---------- 存储卡 ---------- */
async function watchCards() {
  for (;;) {
    try {
      if (S.job) { /* 任务进行中不打扰 */ }
      else if (S.card) {
        const card = S.card, r = await api.card(card.path);
        if (r.error && S.card === card && !S.job) { S.notice = '存储卡已断开。再插上会自动识别。'; reset(); }
      } else {
        const cards = await api.cards();
        // 用户点过"换一张卡"的那张不自动选回去；它被拔掉之后，下次插上照常识别
        if (S.skip && !cards.some(c => c.path === S.skip)) S.skip = null;
        if (JSON.stringify(cards.map(c => c.path)) !== JSON.stringify(S.cards.map(c => c.path))) {
          S.cards = cards;
          if (cards.length === 1 && cards[0].path !== S.skip) pick(cards[0]);
          else if (S.page === 'update') draw(true);
        }
      }
    } catch (e) { /* 读卡偶尔失败不要紧，下一轮再试 */ }
    await sleep(POLL_CARDS_MS);
  }
}
function pick(card) { S.card = card; S.phase = 'ready'; S.plan = null; S.done = null; S.notice = ''; if (S.page === 'update') draw(); loadPlan(); }
/* 用户改了勾选：如果还停在"完成"页，就回到可以再次更新的状态 */
function replan() { if (S.phase === 'done') { S.phase = 'ready'; S.done = null; paintHero(); } loadPlan(); }
function reset() { S.card = null; S.plan = null; S.done = null; S.phase = 'empty'; S.cards = []; S.open.clear(); S.openDirs.clear(); S.lazy.clear(); draw(); }
async function pickFolder() {
  const r = await api.pick_card();
  if (r.cancelled) return;
  if (r.error) { tell('不能用这个位置', esc(r.error)); return; }
  if (!r.card.looks_like_sd && !await ask({ title: '这里不像 Switch 存储卡', body: `<span class="mono">${esc(r.card.path)}</span> 里没有 atmosphere、bootloader、emuMMC 或 Nintendo 文件夹。确定要对它操作吗？`, ok: '仍然使用', danger: true })) return;
  pick(r.card);
}

/* ---------- 整合包来源 ---------- */
async function loadSource(kind) {
  S.sourceBusy = true; paintHero();
  const r = await api.use_source(kind);
  S.sourceBusy = false;
  if (r.firmware) {
    S.source = r; paintHero();
    if (await ask({ title: '这是一个固件包', body: `<span class="mono">${esc(r.firmware.split(/[\\/]/).pop())}</span> 是系统固件，不是整合包。要把它加到「固件」里吗？`, ok: '加到固件' })) { await api.firmware_add(r.firmware); nav('fw'); }
    return;
  }
  S.source = r;
  if (r.error && kind === 'local') tell('不能用这个压缩包', esc(r.error));
  if (S.card && S.phase === 'ready') await loadPlan(); else paintHero();
}
async function loadPlan() {
  if (!S.card) return;
  const card = S.card, plan = await api.plan(card.path);
  if (S.card !== card) return;
  if (plan.error) { await tell('这张卡用不了', esc(plan.error)); reset(); return; }
  S.plan = plan; S.lazy.clear(); S.source = plan.source.kind === 'none' && S.source.error ? { ...plan.source, error: S.source.error } : plan.source;
  if (S.page !== 'update') return;
  if (S.phase === 'ready') draw(true); else if (S.phase === 'done') paintGroups();
}

/* ---------- 更新页 ---------- */
VIEW.update = pg => {
  if (S.phase === 'empty') {
    pg.innerHTML = `<div><h2>换包</h2><p class="lead">插上 Switch 的存储卡，其余的交给它。</p></div>
    <div class="card empty"><div class="slot">${ic('sd', 48)}</div><div><h3>${S.notice ? esc(S.notice) : '正在等待存储卡…'}</h3><p class="muted" style="margin-top:4px">${S.notice ? '正在等待存储卡…' : '会自动识别，不用点刷新。'}</p></div>
      <button class="btn" id="manual">手动选择文件夹…</button></div>
    ${S.cards.length ? `<div class="sec">检测到的存储卡</div><div class="card">${S.cards.map((c, i) => `<button class="pick" data-i="${i}"><span class="gi">${ic('sd')}</span><div style="flex:1"><strong style="font-weight:500">${esc(c.label)}</strong><div class="small muted">${esc(c.letter)} · ${esc(c.fs)}${c.ams ? ` · 大气层 ${c.ams}` : ''}</div></div><span class="small faint">已用 ${c.used_gb} / ${c.total_gb} GB</span>${ic('chev', 16)}</button>`).join('')}</div>` : ''}
    <div class="sec">怎么把卡连到电脑</div>
    <div class="card pad"><div class="how">
      <div><b>1</b><p><strong>hekate 挂载：</strong>关机后按住音量减再按电源进入 hekate，用数据线连电脑，点「工具」「USB 工具」「SD 卡」。</p></div>
      <div><b>2</b><p><strong>读卡器：</strong>拔出存储卡，插进读卡器。</p></div>
      <div><b>3</b><p><strong>特斯拉菜单：</strong>菜单里有「SD 卡挂载」的话，挂载后直接连电脑。</p></div></div></div>`;
    $('#manual').onclick = pickFolder;
    $$('.pick', pg).forEach(b => b.onclick = () => pick(S.cards[+b.dataset.i]));
    return;
  }
  const c = S.card;
  pg.innerHTML = `<div class="dev"><span class="ico">${ic('sd', 22)}</span><div><strong>${esc(c.label)}</strong><span class="small muted">${esc(c.letter)}${c.fs ? ' · ' + esc(c.fs) : ''}</span></div>
      <div class="use"><div class="meter"><b id="mt"></b></div><div class="small faint" style="margin-top:4px">可用 ${c.free_gb} GB，共 ${c.total_gb} GB</div></div>
      <span class="sp"></span><button class="btn" id="chg">换一张卡</button></div>
    <div class="card pad hero" id="hero"></div><div id="groups" style="display:contents"></div>`;
  const pct = c.total_gb ? Math.round(c.used_gb / c.total_gb * 100) : 0;
  requestAnimationFrame(() => requestAnimationFrame(() => $('#mt') && ($('#mt').style.width = pct + '%')));
  $('#chg').onclick = () => { if (S.job) return; S.skip = S.card.path; reset(); };
  paintGroups();
  if (S.phase === 'done') paintDone(); else paintHero();
};

/* 正版系统、虚拟系统、密钥和证书可以取消保留，但要再确认一次 */
const GUARD_WARNING = {
  emu: '这是正版系统的数据（Nintendo）和虚拟系统（emuMMC），里面有已安装的游戏。体积太大，<b>不会存进快照</b>，清掉之后无法恢复。',
  games: '这些是放在卡上的游戏安装包。体积太大，<b>不会存进快照</b>，清掉之后无法恢复，只能重新拷贝。',
  media: '这些是放在卡上的视频和音乐。体积太大，<b>不会存进快照</b>，清掉之后无法恢复。',
  keys: '联网证书是给真实系统刷机用的。<br><br>大气层只有在能正常进入真实系统或虚拟系统时才会提取它，进不去就提取不了。虚拟系统又是从真实系统复制出来的，所以两个系统都进不去时，想修复真实系统只能刷机；那时如果没有联网证书，就只能刷成被封禁（ban）的机器。<br><br>除非你在别处另有备份，否则不要清掉。',
};
async function confirmDrop(group, what) {
  if (group.kind !== 'guard') return true;
  return ask({ title: `不保留「${what}」？`, danger: true, ok: '不保留', body: GUARD_WARNING[group.id] });
}

/* 类别里的文件按文件夹层级显示，可以一层层点进去 */
const INDENT = 22, ROW_PAD = 18, CARD_ROOT = '';
function buildTree(items) {
  const root = { kids: new Map() };
  for (const item of items) {
    const parts = item.path.split('/');
    let node = root;
    parts.forEach((part, i) => {
      if (!node.kids.has(part)) node.kids.set(part, { name: part, path: parts.slice(0, i + 1).join('/'), kids: new Map() });
      node = node.kids.get(part);
    });
    node.item = item;
  }
  return root;
}
const leavesOf = node => node.item ? [node.item] : [...node.kids.values()].flatMap(leavesOf);

function rowHtml(r) {
  return `<div class="sub ${r.fresh ? 'fresh' : ''}" style="padding-left:${ROW_PAD + r.depth * INDENT}px" data-k="${esc(r.key)}" data-p="${esc(r.path)}" data-t="${r.type}">
    ${r.expandable ? `<button class="disc ${r.open ? 'on' : ''}" aria-expanded="${r.open}" aria-label="展开 ${esc(r.label)}">${ic('chev', 13)}</button>` : '<span class="disc-sp"></span>'}
    <button class="cb" role="checkbox" aria-checked="${r.checked}" aria-label="保留 ${esc(r.path)}" ${r.fixed ? 'disabled' : ''}>${ic('check', 13, 'ck')}${ic('dash', 13, 'mx')}</button>
    <span class="fi ${r.dir ? '' : 'f'}">${ic(r.dir ? 'folder' : 'file', 15)}</span>
    <span class="mono sel nm">${r.hint ? `<b class="tn">${esc(r.hint)}</b><em>${esc(r.label)}</em>` : esc(r.label)}</span><span class="why ${r.cls === 'keep' ? '' : r.cls}">${r.text}</span></div>`;
}
/* 卡上真实存在的一项：文件，或者整个处理方式一致的文件夹（点开时再去读里面的内容） */
function itemRows(item, gid, depth, label, fresh) {
  const key = gid + '|' + item.path, open = item.dir && S.openDirs.has(key), kids = open ? S.lazy.get(item.path) : null;
  let html = rowHtml({ key, path: item.path, type: 'item', depth, label, dir: item.dir, expandable: item.dir, open, fresh,
    checked: item.keep, cls: item.cls, text: item.text, hint: item.hint, fixed: item.fixed });
  if (open) {
    const inner = fresh || S.justOpened === key;
    html += kids ? (kids.map(k => itemRows(k, gid, depth + 1, k.path.split('/').pop(), inner)).join('') || `<div class="sub faint" style="padding-left:${ROW_PAD + (depth + 1) * INDENT + 22}px">空文件夹</div>`)
      : `<div class="sub faint" style="padding-left:${ROW_PAD + (depth + 1) * INDENT + 22}px">正在读取…</div>`;
  }
  return html;
}
function treeRows(node, gid, depth, fresh) {
  return [...node.kids.values()].map(start => {
    let n = start, label = n.name;
    while (!n.item && n.kids.size === 1) { n = [...n.kids.values()][0]; label += '/' + n.name; }   // 只有一个子项的连成一行
    if (n.item) return itemRows(n.item, gid, depth, label, fresh);
    const key = gid + '|' + n.path, open = S.openDirs.has(key), all = leavesOf(n), kept = all.filter(i => i.keep).length;
    return rowHtml({ key, path: n.path, type: 'folder', depth, label, dir: true, expandable: true, open, fresh, fixed: all.every(i => i.fixed),
      checked: kept === all.length ? 'true' : kept ? 'mixed' : 'false', cls: kept === all.length ? 'keep' : kept ? 'mix' : 'del',
      text: kept === all.length ? `${all.length} 项 · 保留` : kept ? `保留 ${kept} 项 · 清除 ${all.length - kept} 项` : `${all.length} 项 · 清除` })
      + (open ? treeRows(n, gid, depth + 1, fresh || S.justOpened === key) : '');
  }).join('');
}

function paintGroups() {
  const box = $('#groups'); if (!box) return;
  if (!S.plan) { box.innerHTML = `<div class="card pad muted">正在检查这张卡上的内容…</div>`; return; }
  const trees = new Map(S.plan.groups.map(g => [g.id, buildTree(g.items)]));
  const row = g => `<div class="grp ${S.open.has(g.id) ? 'open' : ''}" data-g="${g.id}" data-c="${g.cls}"><div class="grp-h">
      <button class="disc" aria-expanded="${S.open.has(g.id)}" aria-label="展开 ${g.name}">${ic('chev', 14)}</button>
      <button class="cb" role="checkbox" aria-checked="${g.checked}" aria-label="保留 ${g.name}" ${g.fixed ? 'disabled' : ''}>${ic('check', 13, 'ck')}${ic('dash', 13, 'mx')}</button>
      <span class="gi">${ic(g.icon, 17)}</span>
      <div class="grp-t"><strong>${g.name}</strong><span>${S.phase === 'done' ? '' : g.desc + ' · '}${fmt(g.count)} 项</span></div>
      <span class="pill ${g.cls}" data-t="${esc(g.text)}">${g.text}</span></div>
      <div class="grp-b"><div class="grp-in">${S.open.has(g.id) ? treeRows(trees.get(g.id), g.id, 0, false) : ''}${g.more ? `<div class="sub faint">还有 ${fmt(g.more)} 项没有列出</div>` : ''}</div></div></div>`;
  // 刚更新完：只列出卡上现在有什么，不谈下次更新会怎样
  const plain = S.phase === 'done';
  box.classList.toggle('plain', plain);
  const keep = S.plan.groups.filter(g => g.kind !== 'clear'), clear = S.plan.groups.filter(g => g.kind === 'clear');
  box.innerHTML = plain
    ? `<div class="sec">卡上现在的文件</div><div class="card">${S.lazy.has(CARD_ROOT) ? S.lazy.get(CARD_ROOT).map(k => itemRows(k, 'card', 0, k.path, false)).join('') : '<div class="sub faint">正在读取…</div>'}</div>`
    : `<div class="sec">会保留 <span>在白名单里。取消勾选就会清掉</span></div><div class="card">${keep.map(row).join('')}</div>
    ${clear.length ? `<div class="sec">会清除 <span>清掉后装上新的整合包。想留下的可以勾上</span></div><div class="card">${clear.map(row).join('')}</div>` : ''}`;
  S.justOpened = null;
  if (plain) {
    for (const sub of $$('.sub[data-k]', box)) {
      const key = sub.dataset.k, open = () => { if (S.openDirs.has(key)) S.openDirs.delete(key); else { S.openDirs.add(key); S.justOpened = key; } paintGroups(); };
      if (sub.querySelector('.disc')) for (const el of ['.disc', '.nm', '.fi']) sub.querySelector(el).onclick = open;
    }
    if (!S.lazy.has(CARD_ROOT) && !S.loading.has(CARD_ROOT)) {
      S.loading.add(CARD_ROOT);
      api.children(S.card.path, CARD_ROOT).then(kids => { S.loading.delete(CARD_ROOT); S.lazy.set(CARD_ROOT, Array.isArray(kids) ? kids : []); paintGroups(); });
    }
  }
  $$('.grp', box).forEach(el => {
    const id = el.dataset.g, group = S.plan.groups.find(g => g.id === id);
    const toggle = () => { S.open.has(id) ? S.open.delete(id) : S.open.add(id); paintGroups(); };
    el.querySelector('.grp-h .disc').onclick = toggle; el.querySelector('.grp-t').onclick = toggle;
    const cb = el.querySelector('.grp-h .cb');
    cb.onclick = async () => { const on = cb.getAttribute('aria-checked') !== 'true'; if (!on && !await confirmDrop(group, group.name)) return; cb.setAttribute('aria-checked', on); await api.set_group(id, on); replan(); };
    $$('.sub[data-k]', el).forEach(sub => {
      const key = sub.dataset.k, path = sub.dataset.p, disc = sub.querySelector('.disc');
      const open = () => { if (S.openDirs.has(key)) S.openDirs.delete(key); else { S.openDirs.add(key); S.justOpened = key; } paintGroups(); };
      if (disc) { disc.onclick = open; sub.querySelector('.nm').onclick = open; sub.querySelector('.fi').onclick = open; }
      const box = sub.querySelector('.cb');
      box.onclick = async () => {
        const keep = box.getAttribute('aria-checked') !== 'true';
        if (!keep && !await confirmDrop(group, path)) return;
        box.setAttribute('aria-checked', keep);
        // 虚拟的上层文件夹只改这个类别里属于它的那些项，不会连带改到别的类别
        const node = sub.dataset.t === 'folder' ? path.split('/').reduce((n, part) => n.kids.get(part), trees.get(id)) : null;
        const r = await api.set_rules(S.card.path, node ? leavesOf(node).map(i => i.path) : [path], keep);
        if (r.error) toast(r.error);
        replan();
      };
    });
  });
  // 点开的真实文件夹，里面的内容现读
  for (const key of S.openDirs) {
    const path = key.slice(key.indexOf('|') + 1);
    if (S.lazy.has(path) || S.loading.has(path) || !$(`.sub[data-k="${CSS.escape(key)}"][data-t="item"]`)) continue;
    S.loading.add(path);
    api.children(S.card.path, path).then(kids => { S.loading.delete(path); S.lazy.set(path, Array.isArray(kids) ? kids : []); paintGroups(); });
  }
}

function pillRun(stage) {
  for (const el of $$('.grp')) {
    const p = el.querySelector('.pill'), c = el.dataset.c;
    let cls = c, text = p.dataset.t, busy = false;
    if (c === 'keep') text = stage === 'done' ? '已保留' : '保留';
    else if (stage === 'wait') { cls = 'wait'; text = '等待中'; }
    else if (stage === 'clean') { busy = true; text = '清理中'; }
    else if (stage === 'install' || stage === 'done') text = c === 'del' ? '已清除' : '已处理';
    p.className = 'pill ' + cls + (busy ? ' busy' : ''); p.textContent = text;
  }
}

async function start() {
  const plan = S.plan, has = S.source.kind === 'online' || S.source.kind === 'local';
  const off = plan.groups.filter(g => g.kind !== 'clear' && !g.fixed && g.checked !== 'true').map(g => g.name);
  const c = S.card, where = `<span class="mono sel">${esc(c.letter)}</span> ${esc(c.label)}${c.total_gb ? `（${c.total_gb} GB，已用 ${c.used_gb} GB）` : ''}`;
  // 每次开始前都确认一遍位置和数量，免得选错了盘
  const ok = await ask({ title: has ? '确认更新这个位置？' : '确认清理这个位置？', danger: true, ok: has ? '清掉并更新' : '开始清理',
    body: `位置：${where}<br>${plan.card_mode ? '' : '这里不是可移动存储卡，只覆盖整合包里的文件，白名单以外的也不清理。<br>'}`
      + `会清掉 <b>${fmt(plan.totals.delete)}</b> 个文件${has ? `，装入 ${fmt(plan.totals.install)} 个新文件` : ''}。`
      + `${off.length ? `<br>没有全部保留：<b>${off.join('、')}</b>。` : ''}${!has ? '<br>大气层本身也会被清掉，之后要再装一次整合包才能开机。' : ''}`
      + `<br>${S.opts.snapshot ? '会先创建快照，之后可以恢复。' : '<span style="color:var(--red)">没有开快照，清掉后无法恢复。</span>'}` });
  if (!ok) return;
  const r = await api.start(S.card.path, plan.totals.delete);
  if (r.error) { tell('没有开始', esc(r.error)); if (r.replan) loadPlan(); return; }
  S.phase = 'run'; $('#page').classList.add('locked'); $('#srcm')?.classList.remove('show'); $('#snaprow')?.remove();
  $('#act').outerHTML = `<div class="prog" id="prog"><div class="row"><strong id="pl">准备中</strong><span class="sp"></span><span class="small muted" id="ps" style="font-variant-numeric:tabular-nums"></span></div><div class="pbar"><b id="pb"></b></div><div class="path" id="px"></div><div class="row"><button class="btn" id="stop">停止</button><span class="small faint">请不要拔出存储卡。</span></div></div>`;
  const eyebrow = $('#hero .eyebrow:not(.warn)'); if (eyebrow) eyebrow.textContent = has ? '正在更新' : '正在清理';
  let danger = false;
  $('#stop').onclick = async () => {
    if (!danger) { api.stop(); return; }
    await api.pause(true);
    const sure = await ask({ title: '现在停止？', danger: true, ok: '仍然停止', cancel: '继续', body: `旧文件已经清掉一部分，现在停止的话卡上的大气层可能不完整，Switch 可能开不了机。${S.opts.snapshot ? '可以在「快照」里恢复，或者重新运行一次更新。' : '重新运行一次更新可以修复。'}` });
    sure ? await api.stop() : await api.pause(false);
  };
  pillRun('wait');
  const state = await follow(st => {
    const name = st.steps[st.step] || '';
    danger = st.danger;
    $('#pl').textContent = `${name}（第 ${st.step + 1} 步，共 ${st.steps.length} 步）`;
    $('#pb').style.transform = `scaleX(${(st.step + st.frac) / st.steps.length})`;
    $('#ps').textContent = st.detail; $('#px').textContent = st.path;
    pillRun(name === STEP_CLEAN ? 'clean' : name === STEP_INSTALL || name === STEP_VERIFY ? 'install' : 'wait');
  });
  if (state.error || state.cancelled) {
    const fresh = await api.card(S.card.path); if (fresh.card) S.card = fresh.card;
    S.phase = 'ready'; S.plan = null; draw(); loadPlan();
    if (state.error) tell('没有完成', `${esc(state.error)}${state.danger ? '<br><br>卡上的文件已经改动了一部分。可以重新运行一次更新' + (S.opts.snapshot ? '，或者在「快照」里恢复。' : '。') : '<br><br>存储卡没有被改动。'}`);
    else toast(state.danger ? '已停止。清掉的文件可以在「快照」里恢复' : '已停止，存储卡没有被改动');
    return;
  }
  S.done = state.result; if (state.result.card) S.card = state.result.card;
  S.phase = 'done'; S.plan = null; $('#page').classList.remove('locked');
  paintDone(); paintGroups(); loadPlan();
}

function paintDone() {
  const h = $('#hero'), d = S.done, c = S.card;
  h.innerHTML = `${OK_MARK}
    <h1>${d.package ? `已更新到大气层 ${d.ams || c.ams || ''}` : '清理完成'}</h1>
    <p class="lead" id="dl">${d.package && d.hos ? `支持系统 ${d.hos} 及以下。` : ''}清掉了 ${fmt(d.deleted)} 个旧文件${d.package ? `，装入并校验了 ${fmt(d.installed)} 个文件` : ''}，白名单里的内容都还在。</p>
    <div class="row"><button class="btn pri big" id="ej">${ic('eject', 16)}安全弹出</button><button class="btn" id="tofw">接着装固件</button>${d.snapshot ? '<button class="btn" id="tosn">查看快照</button>' : ''}<span class="sp"></span><button class="btn txt" id="back">返回</button></div>`;
  if (!RM) h.animate([{ opacity: 0, transform: 'scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 480, easing: EASE });

function openRules() {
  let filter = 'all', query = '', rows = [];
  sheet({
    title: '规则', body: `<div class="card" style="box-shadow:inset 0 0 0 1px var(--hair)"><div class="li"><div><strong>读取存储卡上的名单</strong><span class="d">atmosphere 文件夹或根目录里的 whitelist.txt、blacklist.txt</span></div><button class="sw" role="switch" aria-checked="${!!S.opts.read_sd}" id="r-sd" aria-label="读取存储卡上的名单"></button></div></div>
    <div class="row"><input class="inp" id="r-q" placeholder="搜索路径，例如 JKSV" aria-label="搜索路径"><div class="chips" id="r-f"><button class="chip on" data-f="all">全部</button><button class="chip" data-f="keep">保留</button><button class="chip" data-f="del">清除</button><button class="chip" data-f="hit">本卡命中</button></div></div>
    <p class="small faint" id="r-n">正在读取…</p><div id="r-l"></div>`,
    async onOpen() {
      const paint = () => {
        const shown = rows.filter(r => (filter === 'all' || (filter === 'hit' ? r.hit : r.act === filter)) && (!query || r.path.toLowerCase().includes(query)));
        $('#r-n').textContent = `共 ${rows.length} 条规则，这张卡命中 ${rows.filter(r => r.hit).length} 条。先看你的设置，再看黑名单，再看白名单，其余清除。`;
        $('#r-l').innerHTML = shown.map(r => `<div class="rl ${r.hit ? '' : 'miss'}"><span class="tag ${r.act === 'keep' ? 'ok' : 'bad'}">${r.act === 'keep' ? '保留' : '清除'}</span><span class="mono sel">${esc(r.path)}</span>${r.hit ? '<span class="tag info">命中</span>' : ''}<span class="tag ${r.src === '你的设置' ? 'info' : r.src === '内置' ? '' : 'warn'}">${r.src}</span>${r.src === '你的设置' ? `<button class="btn txt" data-rm="${esc(r.path)}">移除</button>` : ''}</div>`).join('') || '<p class="muted">没有符合的规则。</p>';
        $$('[data-rm]').forEach(b => b.onclick = async () => { await api.clear_rule(b.dataset.rm); await reload(); loadPlan(); });
      };
      const reload = async () => { rows = await api.rule_list(S.card.path); paint(); };
      $('#r-q').oninput = e => { query = e.target.value.trim().toLowerCase(); paint(); };
      $$('#r-f .chip').forEach(c => c.onclick = () => { filter = c.dataset.f; $$('#r-f .chip').forEach(x => x.classList.toggle('on', x === c)); paint(); });
      $('#r-sd').onclick = async e => { const b = e.currentTarget, on = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', on); S.opts = await api.set_option('read_sd', on); await reload(); loadPlan(); };
      await reload();
    },
  });
}

  pg.innerHTML = `<div><h2>固件</h2><p class="lead">${S.card ? `把系统固件放进存储卡，再用 Daybreak 安装。${S.card.hos ? `卡上的大气层 ${S.card.ams} 最高支持系统 ${S.card.hos}。` : ''}` : '先在「更新」里连接存储卡，才能安装固件。'}</p></div>

    <div class="card" id="fwl"><div class="li"><div><span class="d">正在读取固件列表…</span></div></div></div>`;
  const paint = () => {
    const items = data[tab], note = tab === 'online' && data.online_error ? data.online_error : items.length ? '' : tab === 'local' ? '还没有本地固件。' : '在线列表是空的。';
    $('#fwl').innerHTML = note ? `<div class="li"><div><span class="d sel">${esc(note)}</span></div></div>` : items.map((f, i) => `<div class="li" data-i="${i}"><span class="gi">${ic('chip', 17)}</span><div><strong>${esc(f.name)}</strong><span class="d">${f.mb ? f.mb + ' MB' : tab === 'online' ? '在线' : ''}${f.compatible === false ? ` · 高于卡上大气层支持的 ${data.hos}` : ''}</span></div>${f.compatible == null ? '' : `<span class="tag ${f.compatible ? 'ok' : 'warn'}">${f.compatible ? '兼容' : '可能不兼容'}</span>`}${tab === 'local' ? '<button class="btn txt" data-del>删除</button>' : ''}<button class="btn" data-ins ${S.card ? '' : 'disabled'}>安装</button></div>`).join('');
    $$('[data-del]', pg).forEach(b => b.onclick = async () => { const r = await api.firmware_delete(data.local[+b.closest('.li').dataset.i].path); if (r.error) tell('没有删除', esc(r.error)); load(); });

  };

  const install = async (li, item) => {
    if (item.compatible === false && !await ask({ title: '可能不兼容', danger: true, ok: '仍然安装', body: `${esc(item.name)} 高于卡上大气层 ${S.card.ams} 支持的最高版本 ${data.hos}。建议先更新整合包再装这个固件。` })) return;
    const r = await api.firmware_install(S.card.path, item);
    if (r.error) { tell('没有开始', esc(r.error)); return; }
    $$('[data-ins],[data-del]', pg).forEach(x => x.disabled = true);
    li.insertAdjacentHTML('beforeend', '<div class="pbar"><b></b></div>');

    await load();
    tell('固件已放进存储卡', `<span class="mono sel">${esc(S.card.letter)}${S.card.is_drive ? '' : '\\'}${esc(state.result.folder)}\\</span><br><br>这一步只是把固件文件复制到卡上，系统还没有升级。把卡插回 Switch，打开 Daybreak，选择这个文件夹安装。`);
  };
  seg($('#fwt'), tab, v => { tab = v; if (data) paint(); });

  load();
};

  const setUrl = async v => { S.opts = await api.set_option('url', v); toast(S.opts.url ? '已保存' : '已恢复默认地址'); draw(true); if (S.source.kind !== 'local') loadSource('online'); };
  $('#url').onchange = e => setUrl(e.target.value); $('#urld').onclick = () => setUrl('');
  $$('.sw[data-k]', pg).forEach(b => b.onclick = async () => { const on = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', on); S.opts = await api.set_option(b.dataset.k, on); if (S.card && S.phase === 'ready') { S.plan = null; loadPlan(); } });
};

window.addEventListener('pywebviewready', async () => {
  api = window.pywebview.api;
  const info = await api.ready();
  applyTheme(info.settings.theme);
  S.opts = await api.options();
  drawSide(); draw();
  loadSource('online'); watchCards();
});
</script>
</body>
</html>
